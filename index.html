<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>BTC live price by cv0x</title>
</head>
<body>
    <div class="stage">
        <div class="card">
            <i class='bx bxl-bitcoin' id="btc-logo"></i>
            <div class="pizzaday">
                <img src="btcpizzaday.png" alt="Bitcoin pizza day 22.05.">
            </div>
            <div class="tothemoon">
                <img src="btcship.png" alt="Bitcoin to the moon">
            </div>
            <div class="moon">
                <img src="goldenmoon.png" alt="the moon">
            </div>
            <div class="btc-backgound"></div>
            <p id="btc-price">Loading...</p>
            <svg id="btc-chart" class="graf" viewBox="0 0 400 220" preserveAspectRatio="none" aria-label="Bitcoin 7d chart">
                <polyline id="btc-chart-line" fill="none" stroke-width="2" vector-effect="non-scaling-stroke"></polyline>
            </svg>
        </div>
    </div>
    <div class="donate">
        <i class='bx bxs-heart' id="donate-icon"></i>
        <div class="donate-box">
            <h3>Support the creator</h3>
            <img src="btcsupport.png" alt="Support the creator - BTC QR codes">
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
